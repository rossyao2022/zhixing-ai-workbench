# Install this file as /etc/nginx/conf.d/kuakua-ai-rate-limit.conf.
# nginx loads conf.d inside the http context, where shared limit zones belong.
limit_req_zone $binary_remote_addr zone=kuakua_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=kuakua_api:10m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=kuakua_conn:10m;
