# Put these locations inside the existing happykua.com HTTPS server block.
location = /kuakua-ai-api {
    return 308 /kuakua-ai-api/;
}

# Password hashing is intentionally expensive. Keep public auth endpoints on a
# tighter per-IP budget so they cannot exhaust API worker threads or CPU.
location ~ ^/kuakua-ai-api/auth/(?:login|register)/?$ {
    limit_req zone=kuakua_auth burst=3 nodelay;
    limit_conn kuakua_conn 5;
    proxy_pass http://127.0.0.1:8791;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    client_max_body_size 64k;
    proxy_hide_header Server;
}

location /kuakua-ai-api/ {
    limit_req zone=kuakua_api burst=30 nodelay;
    limit_conn kuakua_conn 20;
    # The trailing slash strips /kuakua-ai-api/ before proxying.
    proxy_pass http://127.0.0.1:8791/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    client_max_body_size 64k;
    proxy_hide_header Server;
}
